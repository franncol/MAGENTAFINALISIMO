<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="transicion.js"></script>
  <title>Progreso registrado | Google Magenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="recorrido.css">
  <link rel="stylesheet" href="transicion.css">
</head>
<body>
  <div class="stage" id="stage">
    <img class="fondo-img" src="assets/recorrido/fondo-glitch.png" alt="">
    <main class="diseno">
      <header class="encabezado"><span>1/3</span></header>
      <h1 class="titulo-progreso">¡PROGRESO REGISTRADO!</h1>

      <div class="recorrido">
        <div class="nodo nodo--hecho">
          <div class="nodo__circulo">✓</div>
          <p class="nodo__nombre">CÓMO FUNCIONA</p>
          <p class="nodo__cable">CABLE 1</p>
        </div>
        <div class="union"><i></i></div>
        <div class="nodo">
          <div class="nodo__circulo">2</div>
          <p class="nodo__nombre">CÓMO INTERACTÚA</p>
          <p class="nodo__cable">CABLE 2</p>
        </div>
        <div class="union"><i></i></div>
        <div class="nodo">
          <div class="nodo__circulo">3</div>
          <p class="nodo__nombre">QUIZ</p>
          <p class="nodo__cable">CABLE 3</p>
        </div>
      </div>

      <a class="pildora-tut" href="como-interactua.html" style="--tut-bg:rgba(79,123,255,.5);--tut-c:#4f7bff;--tut-g:rgba(79,123,255,.75)">
        <span class="pildora-tut__icono"><img src="assets/recorrido/icono-cable.svg" alt=""></span>
        <span class="pildora-tut__texto">CONECTÁ EL CABLE 2</span>
      </a>
    </main>
  </div>
  <script src="stage.js"></script>
  <script src="consola.js"></script>
</body>
</html>
